{% extends "app/base.html" %}
{% block title %}Home - Community Hub{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-10">
    <!-- Search Section -->
    <div class="bg-white shadow rounded-lg p-8 text-center">
        <h1 class="text-3xl font-bold mb-6">Explore Communities</h1>

        <form method="get" action="{% url 'communities' %}" class="flex flex-col md:flex-row md:items-center md:space-x-4 space-y-4 md:space-y-0">
            <input type="text" name="q" placeholder="Search by name or description..."
                class="flex-1 px-4 py-3 border border-gray-300 rounded-full focus:ring-2 focus:ring-purple-500 focus:border-transparent">
            
            <select name="category" class="px-4 py-3 border border-gray-300 rounded-full focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                <option value="">All Categories</option>
                {% for category in categories %}
                <option value="{{ category.slug }}">{{ category.name }}</option>
                {% endfor %}
            </select>

            <button type="submit" class="px-6 py-3 bg-purple-600 text-white font-semibold rounded-full hover:bg-purple-700 transition">
                Search
            </button>
        </form>
    </div>

    <!-- CTA: Know a Community? -->
    <div class="bg-gradient-to-r from-purple-50 to-purple-100 shadow-md rounded-lg mt-8 p-8 text-center">
        <h2 class="text-2xl font-bold text-gray-800 mb-4">Know a Community?</h2>
        <p class="text-gray-600 mb-6">Help us grow the hub by sharing communities you know. Your contribution makes discovery easier for everyone!</p>
        
        <a href="{% url 'submit_community' %}" 
           class="inline-block px-8 py-3 bg-purple-600 text-white font-semibold rounded-full hover:bg-purple-700 transition transform hover:scale-105">
           Submit a Community
        </a>
    </div>
</div>
{% endblock %}
